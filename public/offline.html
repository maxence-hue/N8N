<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADSolar Chat - Hors ligne</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        max-width: 420px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card" role="status">
      <img src="/icon-512.png" alt="ADSolar" width="96" height="96" style="margin-bottom: 1rem;" />
      <h1>Connexion perdue</h1>
      <p>Vous êtes hors ligne. Les messages seront envoyés dès que la connexion sera rétablie.</p>
      <p>Merci de vérifier votre connexion internet.</p>
    </div>
  </body>
</html>
